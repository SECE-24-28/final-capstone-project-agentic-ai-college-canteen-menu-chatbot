<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Weekly Food Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">AI</div>
        <div>
          <h1>Hostel Weekly Food Chatbot</h1>
          <p>Ask what food is available on any day of the week.</p>
        </div>
      </div>
      <div class="status" aria-label="Assistant status"><span></span> Ready</div>
    </header>

    <section class="workspace">
      <section class="chat-panel" aria-label="Hostel food chatbot">
        <div class="chat-header">
          <div>
            <h2>Weekly Menu Assistant</h2>
            <p>Ask about food availability, day menus, or meal details.</p>
          </div>
        </div>
        <div class="chat-log" id="chatLog" aria-live="polite"></div>
        <form class="chat-form" id="chatForm">
          <input id="chatInput" type="text" autocomplete="off" placeholder="Ask: Is chapati available on Monday?" aria-label="Type your hostel menu question" />
          <button id="sendBtn" type="submit">Send</button>
        </form>
      </section>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
